<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/icones/favicon-roxo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onde Vai Passar: onde assistir aos jogos do seu time</title>
  <link rel="canonical" href="https://ondevaipassar.com/" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Descubra em que canal ou streaming passa o jogo do seu time: Brasileirão, Copa do Brasil, Libertadores, estaduais, futebol feminino e ligas europeias. Atualizado todo dia." />

  <!-- Prévia de link (WhatsApp, redes sociais) — og-image.png é uma imagem
       fixa 1200x630 (padrão Open Graph), gerada uma vez a partir do
       mesmo logo/marca do site, não por página (SPA sem server-side
       rendering, então não dá pra variar por rota). width/height
       explícitos ajudam o WhatsApp especificamente a cortar a prévia do
       jeito certo, em vez de adivinhar a partir do arquivo. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ondevaipassar.com/" />
  <meta property="og:title" content="Onde Vai Passar: onde assistir aos jogos do seu time" />
  <meta property="og:description" content="Descubra em que canal ou streaming passa o jogo do seu time: Brasileirão, Copa do Brasil, Libertadores, estaduais, futebol feminino e ligas europeias. Atualizado todo dia." />
  <meta property="og:image" content="https://ondevaipassar.com/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Onde Vai Passar" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Onde Vai Passar: onde assistir aos jogos do seu time" />
  <meta name="twitter:description" content="Descubra em que canal ou streaming passa o jogo do seu time: Brasileirão, Copa do Brasil, Libertadores, estaduais, futebol feminino e ligas europeias. Atualizado todo dia." />
  <meta name="twitter:image" content="https://ondevaipassar.com/images/og-image.png" />


  <!-- Dados estruturados: o site e quem o mantém, para o Google mostrar o nome certo nos resultados. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        { "@type": "WebSite", "@id": "https://ondevaipassar.com/#site", "url": "https://ondevaipassar.com/", "name": "Onde Vai Passar", "inLanguage": "pt-BR" },
        { "@type": "Organization", "@id": "https://ondevaipassar.com/#org", "name": "Onde Vai Passar", "url": "https://ondevaipassar.com/", "logo": "https://ondevaipassar.com/images/og-image.png", "email": "contato@ondevaipassar.com" }
      ]
    }
  </script>

  <link rel="stylesheet" href="./src/input.css" />
</head>

<body class="w-screen overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
