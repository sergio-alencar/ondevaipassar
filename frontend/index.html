<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/icones/favicon-roxo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onde Vai Passar</title>
  <meta name="description" content="Descubra onde assistir aos jogos do seu time — Séries A, B e C, Europa e Brasileirão Feminino, sempre atualizado." />

  <!-- Prévia de link (WhatsApp, redes sociais) — og-image.png é uma imagem
       fixa 1200x630 (padrão Open Graph), gerada uma vez a partir do
       mesmo logo/marca do site, não por página (SPA sem server-side
       rendering, então não dá pra variar por rota). width/height
       explícitos ajudam o WhatsApp especificamente a cortar a prévia do
       jeito certo, em vez de adivinhar a partir do arquivo. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ondevaipassar.com/" />
  <meta property="og:title" content="Onde Vai Passar" />
  <meta property="og:description" content="Descubra onde assistir aos jogos do seu time — Séries A, B e C, Europa e Brasileirão Feminino, sempre atualizado." />
  <meta property="og:image" content="https://ondevaipassar.com/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="pt_BR" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Onde Vai Passar" />
  <meta name="twitter:description" content="Descubra onde assistir aos jogos do seu time — Séries A, B e C, Europa e Brasileirão Feminino, sempre atualizado." />
  <meta name="twitter:image" content="https://ondevaipassar.com/images/og-image.png" />

  <link rel="stylesheet" href="./src/input.css" />
</head>
