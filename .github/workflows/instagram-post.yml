name: Instagram post

# Posts at most ONE carousel per call, with at least 15 minutes between two
# publications and at most 6 a day — all enforced by the backend itself (see
# backend/src/instagram/pacing.ts), so any trigger (this schedule, the Vercel
# Cron at 10:05 UTC, a manual run) can fire without ever adding up to a burst.
#
# Why: on 2026-10-13/14 the Instagram account was flagged for "automated
# behavior" after days when a dozen carousels went out within a minute or two
# (plus deletions and re-posts in between). This used to be a retry loop that
# drained everything at once; now it is one call per run, and the schedule
# spreads the day's posts out.
#
# GitHub's own scheduler is best-effort and often hours late; that only delays
# a post, it never bunches them, because the gap is checked on the server.
on:
  schedule:
    # Every 15 minutes between 10:00 and 16:59 UTC (07:00-13:59 in Brasília):
    # enough slots for the day's cap, early enough that morning posts are not
    # left for the afternoon. Most runs find nothing to do and end at once.
    - cron: "*/15 10-16 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the next carousel, if the pacing allows one
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://api.ondevaipassar.com/api/cron-instagram-post")
          body=$(cat /tmp/response.json)
          echo "HTTP $http_code -> $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::cron-instagram-post returned HTTP $http_code"
            exit 1
          fi

          # Meta blocked the account: stop and say so (this fails the run, which e-mails).
          if [ "$(echo "$body" | jq -r '.blocked // false')" = "true" ]; then
            echo "::error::Meta rate-limited the account. Nothing more will be posted until it is looked at."
            exit 1
          fi

          # A publish whose outcome is unknown may be live on the account: never retried automatically.
          if [ "$(echo "$body" | jq -r '.unknown // 0')" != "0" ]; then
            echo "::error::A post may or may not be live — check the Instagram account before anything is reset."
            exit 1
          fi

          if [ "$(echo "$body" | jq -r '.failed // 0')" != "0" ]; then
            echo "::warning::A carousel failed this run; the next run will try it again."
          fi
