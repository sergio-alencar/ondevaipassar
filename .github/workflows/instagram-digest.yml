name: Instagram daily digest

# While automatic posting is paused (INSTAGRAM_PAUSED on the API, after the
# account was flagged for "automated behavior" on 2026-10-13/14), this sends
# the day's posts by e-mail instead: one GitHub issue per day with each post's
# caption and its images, exactly as the poster would have made them. GitHub
# e-mails the @mention, so no mail service or extra secret is involved.
#
# Posting by hand from this is the point: the images are saved from the e-mail
# or the issue page and the caption copied from the code block.
on:
  schedule:
    # 10:35 UTC (07:35 in Brasília), after the 10:00 ingest and its follow-ups.
    # GitHub's scheduler is best-effort: on 2026-10-15 the 10:35 run had not
    # started by 12:27 UTC. So there are several slots, and a run that finds
    # today's issue already open does nothing (see "Skip if today's issue exists").
    - cron: "35 10 * * *"
    - cron: "5 11 * * *"
    - cron: "35 11 * * *"
    - cron: "5 12 * * *"
    - cron: "35 12 * * *"
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      include_posted:
        description: "Include matches already posted (to test the e-mail on a day with nothing left)"
        type: boolean
        default: false

permissions:
  issues: write

# One run at a time, so two late slots that start together can't both open today's issue.
concurrency:
  group: instagram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if today's issue exists
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(TZ=America/Sao_Paulo date +"%d/%m/%Y")
          found=$(gh issue list --label instagram --state all --search "\"posts de $today\" in:title" --json number -q 'length')
          if [ "$found" != "0" ]; then
            echo "Today's issue already exists; nothing to do."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Build today's posts and open the issue
        if: env.SKIP != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          http_code=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://api.ondevaipassar.com/api/instagram-digest?includePosted=${{ inputs.include_posted || false }}")
          if [ "$http_code" != "200" ]; then
            echo "::error::instagram-digest returned HTTP $http_code"
            exit 1
          fi

          count=$(jq '.posts | length' /tmp/digest.json)
          if [ "$count" = "0" ]; then
            echo "No posts today (no match with a confirmed channel yet)."
            exit 0
          fi

          # Render every image once now, so the copy is cached and GitHub's image proxy (quick to give up) gets it fast.
          jq -r '.posts[].imageUrls[]' /tmp/digest.json | xargs -P 4 -I{} curl -s -o /dev/null --max-time 60 {}

          today=$(TZ=America/Sao_Paulo date +"%d/%m/%Y")
          {
            echo "@sergio-alencar — posts e stories de hoje ($today): ${count} item(ns). Salve as imagens (toque e segure no celular) e copie a legenda do bloco."
            echo
            jq -r '
              .posts | to_entries[] |
              (if .value.kind == "story"
                then "## \(.key + 1). \(.value.title) — \(.value.matchCount) jogo(s)\n\n**Imagem do story** (9:16)\n\n"
                else "## \(.key + 1). \(.value.title) — \(.value.matchCount) jogo(s)\n\n**Legenda**\n\n```\n\(.value.caption)\n```\n\n**Imagens** (na ordem do carrossel)\n\n"
              end) +
              ([.value.imageUrls | to_entries[] | "![imagem \(.key + 1)](\(.value))"] | join("\n\n")) + "\n"
            ' /tmp/digest.json
          } > /tmp/body.md

          gh label create instagram --color E1306C --description "Posts do dia para o Instagram" --force >/dev/null 2>&1 || true
          # Yesterday's issues are done with: keep one open at a time.
          for old in $(gh issue list --label instagram --state open --json number -q '.[].number'); do
            gh issue close "$old" --comment "Substituída pela de hoje." >/dev/null
          done
          gh issue create --title "Instagram — posts de $today" --label instagram --body-file /tmp/body.md
