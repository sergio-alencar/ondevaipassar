# App name must be globally unique on Fly.io — if "ondevaipassar-api" is
# taken, `fly launch` will prompt for a different one; update this file to
# match whatever you actually end up with.
app = "ondevaipassar-api"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "3000"
  # The app reads DATABASE_URL (libSQL file: scheme), not DATABASE_PATH —
  # this must point inside the mounted volume below or data won't survive a
  # restart. Add DATABASE_AUTH_TOKEN too if pointing at Turso instead of a
  # local file.
  DATABASE_URL = "file:/data/ondevaipassar.db"

[[mounts]]
  source = "ondevaipassar_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Vercel Cron (the real scheduler in production) doesn't exist here — this
  # fallback has no scheduler at all right now (node-cron was removed when
  # the project moved to Vercel Cron). Whatever scheduler gets added back
  # needs the process alive continuously, so keep auto-stop off; don't let
  # this default back to Fly's usual scale-to-zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
